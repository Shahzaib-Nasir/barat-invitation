<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Invitation</title>
    <!-- Google Fonts for Luxury/Minimalist Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@200;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbfa;
            --text-main: #2c2a29;
            --accent-gold: #c5a880;
            --accent-gold-hover: #b3966e;
            --envelope-bg: #f4ede4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-center: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Envelope Experience --- */
        #envelope-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, visibility 1s;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 220px;
            background: var(--envelope-bg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 110px solid #e8dec3;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 3;
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .wax-seal {
            position: absolute;
            width: 50px;
            height: 50px;
            background: var(--accent-gold);
            border-radius: 50%;
            top: 85px;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: opacity 0.4s ease;
        }

        .envelope.open .wax-seal {
            opacity: 0;
            pointer-events: none;
        }

        .envelope-text {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            font-size: 0.8rem;
            color: #666;
            margin-top: 60px;
            z-index: 2;
        }

        /* --- Main Website Content --- */
        #main-content {
            opacity: 0;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            transition: opacity 1.5s ease 0.5s;
            display: none;
        }

        #main-content.visible {
            display: block;
            opacity: 1;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .ampersand {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--accent-gold);
            display: block;
            margin: 10px 0;
        }

        .tagline {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 40px;
        }

        /* --- Countdown Clock --- */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
        }

        .countdown-box {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            min-width: 70px;
            border: 1px solid #f0eae1;
        }

        .countdown-box span {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--accent-gold);
        }

        .countdown-box label {
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
        }

        /* --- Details --- */
        .details-section {
            margin: 50px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 40px 0;
        }

        .details-section h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .details-section p {
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        /* --- Interactive RSVP Form --- */
        .rsvp-section {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid #f0eae1;
            text-align: left;
        }

        .rsvp-section h2 {
            font-family: 'Cinzel', serif;
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #555;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            background-color: #fafafa;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-gold);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: var(--accent-gold-hover);
        }

        #form-status {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 1. Digital Envelope Opening Experience -->
    <div id="envelope-wrapper">
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="wax-seal">M</div>
            <div class="envelope-text">YOU ARE INVITED</div>
        </div>
    </div>

    <!-- 2. Main Premium Invitation Content -->
    <div id="main-content">
        <header>
            <h1>Shahzaib</h1>
            <span class="ampersand">&amp;</span>
            <h1>Khazina</h1>
            <p class="tagline">Are getting married</p>
        </header>

        <!-- Live Countdown -->
        <div class="countdown-container">
            <div class="countdown-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="countdown-box">
                <span id="hours">00</span>
                <label>Hrs</label>
            </div>
            <div class="countdown-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="countdown-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- Event Details -->
        <section class="details-section">
            <h2>The Date &amp; Time</h2>
            <p><strong>Saturday, March 20, 2027</strong></p>
            <p>Ceremony begins at 4:00 PM</p>
            <br>
            <h2>The Venue</h2>
            <p><strong>The Grand Pavilion Resort</strong></p>
            <p>123 Ocean Boulevard, Santa Monica, CA</p>
        </section>

        <!-- RSVP Management Form -->
        <section class="rsvp-section">
            <h2>RSVP Online</h2>
            <!-- Replace Formspree endpoint with your own action ID -->
            <form id="rsvp-form" action="https://formspree.io/f/YOUR_ENDPOINT" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., Jane Doe">
                </div>

                <div class="form-group">
                    <label>Will you attend?</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="attendance" value="Attending" required checked> Joyfully Accept
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="attendance" value="Declining"> Regretfully Decline
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="guests">Number of Guests</label>
                    <select id="guests" name="total_guests">
                        <option value="1">1 (Just me)</option>
                        <option value="2">2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="diet">Dietary Restrictions</label>
                    <input type="text" id="diet" name="dietary" placeholder="e.g., Vegan, Nut Allergy, none">
                </div>

                <button type="submit" class="submit-btn">Send RSVP</button>
                <div id="form-status"></div>
            </form>
        </section>
    </div>

    <script>
        // --- 1. Envelope Animation ---
        const envelope = document.getElementById('envelope');
        const envelopeWrapper = document.getElementById('envelope-wrapper');
        const mainContent = document.getElementById('main-content');

        envelope.addEventListener('click', () => {
            envelope.classList.add('open');
            
            // Wait for flap animation, then fade envelope out and bring in the invitation
            setTimeout(() => {
                envelopeWrapper.style.opacity = '0';
                envelopeWrapper.style.visibility = 'hidden';
                mainContent.classList.add('visible');
            }, 1000);
        });

        // --- 2. Live Countdown Clock ---
        // Set wedding target date
        const weddingDate = new Date("Mar 20, 2027 16:00:00").getTime();

        const countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.querySelector(".countdown-container").innerHTML = "<p>The Big Day is Here!</p>";
            }
        }, 1000);

        // --- 3. AJAX RSVP Handling (Formspree) ---
        const form = document.getElementById("rsvp-form");
        const status = document.getElementById("form-status");
        
        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            const data = new FormData(event.target);
            
            status.innerHTML = "Sending...";
            status.style.color = "var(--text-main)";

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });
                
                if (response.ok) {
                    status.innerHTML = "Thank you! Your RSVP has been received.";
                    status.style.color = "green";
                    form.reset();
                } else {
                    status.innerHTML = "Oops! There was a problem submitting your form.";
                    status.style.color = "red";
                }
            } catch (error) {
                status.innerHTML = "Oops! There was a connection problem.";
                status.style.color = "red";
            }
        });
    </script>
</body>
</html>
